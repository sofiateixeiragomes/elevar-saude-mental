<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recuperar link do meu perfil · Elevar Saúde Mental</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#2D6A4F">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'><rect width='200' height='200' fill='%23FAF7F2'/><path d='M100,128 C75,118 32,100 18,52 C62,66 93,96 100,128 Z' fill='%234D8A6B'/><path d='M100,128 C125,118 168,100 182,52 C138,66 107,96 100,128 Z' fill='%232D6A4F'/><circle cx='100' cy='38' r='14' fill='%23B5743A'/></svg>">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--verde:#2D6A4F;--verde-claro:#40916C;--verde-suave:#B7E4C7;--creme:#FAF7F2;--cinza:#3A3A3A;--cinza-claro:#777;--borda:#E5DFD3}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'DM Sans',sans-serif;background:var(--creme);color:var(--cinza);line-height:1.7;font-weight:300;min-height:100vh;display:flex;flex-direction:column}
  header{text-align:center;padding:36px 20px 8px}
  header svg{height:54px}
  main{flex:1;max-width:500px;margin:24px auto 48px;padding:0 22px;width:100%}
  .card{background:#fff;border:1px solid var(--borda);border-radius:8px;padding:32px 28px}
  h1{font-family:'Cormorant Garamond',serif;font-weight:400;font-size:30px;color:var(--verde);margin-bottom:10px;line-height:1.15}
  p{font-size:14.5px;color:#444;margin-bottom:14px}
  .field{margin:18px 0}
  label{display:block;font-size:11.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--verde);font-weight:500;margin-bottom:6px}
  input{width:100%;padding:12px 14px;border:1px solid var(--borda);border-radius:3px;background:var(--creme);font-family:'DM Sans',sans-serif;font-size:14.5px}
  input:focus{outline:none;border-color:var(--verde)}
  .btn{display:inline-block;background:var(--verde);color:#fff;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:500;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;padding:13px 26px;border-radius:3px;text-decoration:none;width:100%}
  .btn:disabled{opacity:.6;cursor:wait}
  .ok{background:#D1FAE5;color:#065F46;padding:14px 18px;border-radius:4px;font-size:14px;margin-top:18px;line-height:1.55}
  .footer-help{text-align:center;margin-top:20px;font-size:12.5px;color:var(--cinza-claro)}
  .footer-help a{color:var(--verde)}
</style>
</head>
<body>
<header>
  <a href="index.html"><svg viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg"><path d="M200,128 C175,118 132,100 118,52 C162,66 193,96 200,128 Z" fill="#4D8A6B"/><path d="M200,128 C225,118 268,100 282,52 C238,66 207,96 200,128 Z" fill="#2D6A4F"/><circle cx="200" cy="38" r="13" fill="#B5743A"/><text x="200" y="200" text-anchor="middle" font-family="Cormorant Garamond, serif" font-size="62" font-weight="500" letter-spacing="8" fill="#1F4D38">ELEVAR</text><text x="200" y="238" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="14" letter-spacing="6" fill="#5C9176">SAÚDE MENTAL</text></svg></a>
</header>
<main>
  <div class="card" id="card">
    <h1>Recuperar meu perfil</h1>
    <p>É psicólogo(a) parceiro(a) e perdeu o link de gerenciamento do seu perfil? Digite o e-mail que você usou no cadastro — vamos enviar o link de novo.</p>
    <div class="field">
      <label>Seu e-mail</label>
      <input type="email" id="email" autocomplete="email" placeholder="seu@email.com">
    </div>
    <button class="btn" id="btn" onclick="enviar()">Enviar meu link</button>
    <div id="msg"></div>
  </div>
  <p class="footer-help">Quer entrar para a rede? <a href="rede-psicologos.html">Cadastre-se aqui</a>.</p>
</main>
<script>
const FN = 'https://jihryciimzffyjbcphks.supabase.co/functions/v1/send-perfil-link';
async function enviar(){
  const email = document.getElementById('email').value.trim();
  const btn = document.getElementById('btn');
  const msg = document.getElementById('msg');
  if(!email){ return; }
  btn.disabled = true; btn.textContent = 'Enviando…';
  try {
    await fetch(FN, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ email }) });
  } catch(e) {}
  // Sempre mostra a mesma mensagem (não revela se o e-mail existe)
  msg.innerHTML = '<div class="ok">✓ Se houver cadastro com esse e-mail, enviamos o link de perfil agora. Confira sua caixa de entrada (e o spam) em alguns minutos.</div>';
  btn.disabled = false; btn.textContent = 'Enviar meu link';
}
document.getElementById('email').addEventListener('keypress', e => { if(e.key==='Enter') enviar(); });
</script>
</body>
</html>
