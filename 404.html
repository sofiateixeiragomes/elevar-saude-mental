<style>

  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'DM Sans',sans-serif;background:var(--creme);color:#3A3A3A;min-height:100vh;display:flex;flex-direction:column}

  header a{display:inline-block}
  header svg{height:50px;display:block}

  main{flex:1;display:flex;align-items:center;justify-content:center;padding:60px 32px;text-align:center}
  .box{max-width:560px}
  .num{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:clamp(96px,16vw,160px);line-height:1;color:var(--verde-claro);letter-spacing:-4px;font-style:italic}

  p{font-size:16px;color:#666;line-height:1.7;max-width:440px;margin:0 auto 32px}
  .btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .btn{display:inline-block;font-family:'DM Sans',sans-serif;font-weight:500;font-size:12.5px;letter-spacing:1.5px;text-transform:uppercase;padding:13px 24px;border-radius:2px;text-decoration:none;transition:all .2s}
  .btn-primary{background:var(--verde);color:#fff}
  .btn-primary:hover{background:var(--verde-claro)}
  .btn-ghost{background:transparent;color:var(--verde);border:1px solid var(--verde)}
  .btn-ghost:hover{background:var(--verde);color:#fff}

  footer{padding:24px 32px;text-align:center;font-size:12px;color:#999;border-top:1px solid var(--borda)}
  footer em{font-style:italic;color:var(--verde)}
</style>
</head>
