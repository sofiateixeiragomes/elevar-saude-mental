<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cancelar ou remarcar consulta · Elevar Saúde Mental</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#2D6A4F">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'><rect width='200' height='200' fill='%23FAF7F2'/><path d='M100,128 C75,118 32,100 18,52 C62,66 93,96 100,128 Z' fill='%234D8A6B'/><path d='M100,128 C125,118 168,100 182,52 C138,66 107,96 100,128 Z' fill='%232D6A4F'/><circle cx='100' cy='38' r='14' fill='%23B5743A'/></svg>">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--verde:#2D6A4F;--verde-claro:#40916C;--verde-suave:#B7E4C7;--creme:#FAF7F2;--cinza:#3A3A3A;--cinza-claro:#777;--borda:#E5DFD3}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'DM Sans',sans-serif;background:var(--creme);color:var(--cinza);line-height:1.7;font-weight:300;min-height:100vh;display:flex;flex-direction:column}
  header{text-align:center;padding:36px 20px 8px}
  header svg{height:54px}
  main{flex:1;max-width:520px;margin:24px auto 48px;padding:0 22px;width:100%}
  .card{background:#fff;border:1px solid var(--borda);border-radius:8px;padding:32px 28px}
  h1{font-family:'Cormorant Garamond',serif;font-weight:400;font-size:32px;color:var(--verde);margin-bottom:14px;line-height:1.15}
  p{font-size:15px;color:#444;margin-bottom:12px}
  .info{background:var(--creme);border-left:3px solid var(--verde-claro);padding:14px 18px;margin:18px 0;border-radius:3px;font-size:14.5px}
  .info strong{color:var(--verde)}
  .btn{display:inline-block;background:var(--verde);color:#fff;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:500;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;padding:13px 26px;border-radius:3px;text-decoration:none;margin-top:10px}
  .btn-ghost{background:transparent;color:var(--verde);border:1px solid var(--verde)}
  .err{background:#FEE2E2;color:#991B1B;padding:14px 18px;border-radius:4px;font-size:14px;margin-top:14px}
  .ok{background:#D1FAE5;color:#065F46;padding:14px 18px;border-radius:4px;font-size:14px;margin-top:14px}
  .small{font-size:12.5px;color:var(--cinza-claro);margin-top:18px;line-height:1.6}
  .small a{color:var(--verde)}
</style>
</head>
<body>
<header>
  <a href="index.html"><svg viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg"><path d="M200,128 C175,118 132,100 118,52 C162,66 193,96 200,128 Z" fill="#4D8A6B"/><path d="M200,128 C225,118 268,100 282,52 C238,66 207,96 200,128 Z" fill="#2D6A4F"/><circle cx="200" cy="38" r="13" fill="#B5743A"/><text x="200" y="200" text-anchor="middle" font-family="Cormorant Garamond, serif" font-size="62" font-weight="500" letter-spacing="8" fill="#1F4D38">ELEVAR</text><text x="200" y="238" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="14" letter-spacing="6" fill="#5C9176">SAÚDE MENTAL</text></svg></a>
</header>

<main>
  <div class="card" id="card">
    <h1>Cancelar ou remarcar</h1>
    <p>Verificando seu agendamento…</p>
  </div>
  <p class="small">Precisa de ajuda? Fale com a equipe pelo <a href="https://wa.me/556799505131">WhatsApp (67) 99950-5131</a>.</p>
</main>

<script>
const FN_URL = 'https://jihryciimzffyjbcphks.supabase.co/functions/v1/manage-booking';
const params = new URLSearchParams(location.search);
const token = params.get('t');
const card = document.getElementById('card');

if(!token){
  card.innerHTML = '<h1>Link inválido</h1><p>O link de cancelamento parece estar incompleto. Verifique o e-mail que recebeu.</p>';
} else {
  fetch(`${FN_URL}?t=${encodeURIComponent(token)}`).then(r=>r.json()).then(d=>{
    if(d.error){ card.innerHTML = `<h1>Não encontrado</h1><p>${d.error}</p>`; return; }
    if(d.status==='canceled'){ card.innerHTML = `<h1>Já cancelado</h1><p>Este agendamento já foi cancelado anteriormente. O horário foi liberado.</p>`; return; }
    const dt = new Date(d.date+'T12:00:00');
    const dataFmt = dt.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});
    const hora = d.time.slice(0,5);
    const viaLabel = {institucional:'Cota institucional', aberta:'Cota aberta', particular:'Atendimento particular'}[d.via] || d.via;
    let html = `<h1>Cancelar consulta</h1>
      <p>Encontramos seu agendamento. Veja os detalhes antes de prosseguir:</p>
      <div class="info">
        <div><strong>Paciente:</strong> ${d.patient_name}</div>
        <div><strong>Data:</strong> ${dataFmt.charAt(0).toUpperCase()+dataFmt.slice(1)}</div>
        <div><strong>Horário:</strong> ${hora}</div>
        <div><strong>Via:</strong> ${viaLabel}</div>
      </div>`;
    if(d.can_cancel){
      html += `<p>Você pode cancelar agora — faltam <strong>${d.hours_left} horas</strong> para a consulta.</p>
        <button class="btn" id="btnCancel">Cancelar agendamento</button>
        <p class="small">Para <strong>remarcar</strong>, basta cancelar aqui e voltar ao site para escolher um novo horário.</p>`;
    } else {
      html += `<div class="err">Faltam apenas <strong>${d.hours_left} horas</strong> para a consulta — cancelamento online só é permitido com pelo menos 24h de antecedência. Entre em contato pelo WhatsApp para falar com a equipe.</div>`;
    }
    card.innerHTML = html;
    const btn = document.getElementById('btnCancel');
    if(btn){
      btn.onclick = async () => {
        if(!confirm('Tem certeza que quer cancelar esta consulta?')) return;
        btn.disabled = true; btn.textContent = 'Cancelando…';
        const r = await fetch(`${FN_URL}?t=${encodeURIComponent(token)}`, { method:'POST' });
        const j = await r.json();
        if(j.ok){ card.innerHTML = '<h1>Cancelado</h1><p>Seu agendamento foi cancelado e o horário liberado. Se quiser remarcar, é só voltar ao site.</p><p><a class="btn btn-ghost" href="index.html#agendar">Voltar ao site</a></p>'; }
        else { card.insertAdjacentHTML('beforeend', `<div class="err">${j.error||'Erro ao cancelar.'}</div>`); btn.disabled=false; btn.textContent='Cancelar agendamento'; }
      };
    }
  }).catch(()=>{ card.innerHTML = '<h1>Erro</h1><p>Não foi possível verificar agora. Tente novamente em alguns minutos.</p>'; });
}
</script>
</body>
</html>
