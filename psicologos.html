<head>

<title>Psicólogos parceiros · Elevar Saúde Mental</title>
<meta name="description" content="Psicólogos parceiros da Elevar Saúde Mental — abordagens, modalidade, cidade e contato.">
<meta name="theme-color" content="#2D6A4F">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'><rect width='200' height='200' fill='%23FAF7F2'/><path d='M100,128 C75,118 32,100 18,52 C62,66 93,96 100,128 Z' fill='%234D8A6B'/><path d='M100,128 C125,118 168,100 182,52 C138,66 107,96 100,128 Z' fill='%232D6A4F'/><circle cx='100' cy='38' r='14' fill='%23B5743A'/></svg>">

<style>
  :root{--verde:#2D6A4F;--verde-claro:#40916C;--verde-suave:#B7E4C7;--creme:#FAF7F2;--creme-escuro:#EDE8DF;--terra:#7C5C3E;--cinza:#3A3A3A;--cinza-claro:#777;--borda:#E5DFD3;--branco:#fff}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'DM Sans',sans-serif;background:var(--creme);color:var(--cinza);line-height:1.6;font-weight:300}
  em{font-style:italic} a{color:var(--verde)}
  .hero{background:var(--verde);color:#fff;padding:50px 24px 40px;text-align:center;position:relative;overflow:hidden}
  .hero::before{content:'';position:absolute;top:-100px;right:-100px;width:340px;height:340px;border-radius:50%;background:rgba(64,145,108,.28)}
  .hero .inner{position:relative;z-index:1;max-width:680px;margin:0 auto}
  .hero svg{height:56px;margin-bottom:16px}
  .hero h1{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:clamp(28px,5vw,40px);line-height:1.15;margin-bottom:10px}
  .hero h1 em{color:var(--verde-suave)}
  .hero p{font-size:14px;color:rgba(255,255,255,.85);max-width:540px;margin:0 auto}
  .wrap{max-width:920px;margin:28px auto 70px;padding:0 22px}
  .filtros{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px;background:var(--branco);border:1px solid var(--borda);border-radius:6px;padding:16px}
  .filtros .f{flex:1;min-width:150px}
  .filtros label{display:block;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--verde);margin-bottom:5px;font-weight:500}
  .filtros input,.filtros select{width:100%;padding:10px 12px;border:1px solid var(--borda);border-radius:3px;background:var(--creme);font-family:'DM Sans',sans-serif;font-size:14px;color:var(--cinza)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:680px){.grid{grid-template-columns:1fr}}
  .card{background:var(--branco);border:1px solid var(--borda);border-radius:6px;padding:20px 22px;border-top:3px solid var(--verde-claro)}
  .card h3{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:20px;color:var(--verde);margin-bottom:2px}
  .card .crp{font-size:11px;color:var(--cinza-claro);letter-spacing:.5px;margin-bottom:8px}
  .card .ab{font-size:13.5px;color:#444;margin-bottom:6px}
  .card .ab strong{color:var(--verde)}
  .card .linha{font-size:13px;color:#555;margin-bottom:4px}
  .badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10.5px;letter-spacing:.5px;background:var(--verde-suave);color:var(--verde);font-weight:500;margin-right:4px}
  .card .obs{font-size:12.5px;color:#777;font-style:italic;margin-top:6px}
  .card .contato{margin-top:10px;padding-top:10px;border-top:1px solid var(--borda);font-size:13px}
  .card .contato a{color:var(--verde);text-decoration:none;font-weight:500}
  .empty{text-align:center;padding:50px 20px;color:#999;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:18px}
  .cta-cad{text-align:center;margin-top:30px;font-size:13.5px;color:#666}
  .cta-cad a{color:var(--verde);font-weight:500}
  footer{background:var(--verde);color:rgba(255,255,255,.7);padding:30px 24px;text-align:center;font-size:12px}
  footer a{color:var(--verde-suave);text-decoration:none}
</style>
</head>
<body>

<div class="hero">
  <div class="inner">
    <svg viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg" aria-label="Elevar Saúde Mental">

      <text x="200" y="200" text-anchor="middle" font-family="Cormorant Garamond, serif" font-size="62" font-weight="500" letter-spacing="8" fill="#FFFFFF">ELEVAR</text>
      <text x="200" y="238" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="14" letter-spacing="6" fill="#B7E4C7">SAÚDE MENTAL</text>
    </svg>
    <h1>Psicólogos <em>parceiros</em></h1>
    <p>Profissionais que fazem parte da nossa rede de cuidado. A psicoterapia complementa o acompanhamento médico — escolha quem combina com você.</p>
  </div>
</div>

<div class="wrap">
  <div class="filtros">
    <div class="f"><label>Busca (abordagem, nome)</label><input type="text" id="fBusca" placeholder="Ex.: TCC, trauma…" oninput="render()"></div>
    <div class="f"><label>Modalidade</label><select id="fMod" onchange="render()"><option value="">Todas</option><option value="online">Online</option><option value="presencial">Presencial</option><option value="ambos">Online e presencial</option></select></div>
    <div class="f"><label>Cidade</label><input type="text" id="fCidade" placeholder="Ex.: Campo Grande" oninput="render()"></div>
  </div>

  <div id="lista"><div class="empty">Carregando…</div></div>

  <div class="cta-cad">É psicólogo(a) e quer entrar na rede? <a href="rede-psicologos.html">Cadastre-se aqui</a>.</div>
</div>

<footer>
  Elevar Saúde Mental · <a href="index.html">elevarsaudemental.com.br</a> · <a href="https://instagram.com/elevarsaudemental" target="_blank">@elevarsaudemental</a>
</footer>

<script type="module">
const SUPABASE_URL = 'https://jihryciimzffyjbcphks.supabase.co';
const SUPABASE_KEY = 'sb_publishable_TMCOSnSWCzPdj4zerJBZpA_PoalNXjJ';
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
let dados = [];

const modLabel = {online:'Online', presencial:'Presencial', ambos:'Online e presencial'};
const socLabel = {sim:'valor social', as_vezes:'social às vezes'};

async function carregar(){
  const { data, error } = await supabase
    .from('psicologos_parceiros')
    .select('nome,crp,abordagem,modalidade,cidade,valor_online,social_online,valor_presencial,social_presencial,valor_sessao,atende_social,observacoes,email,telefone')
    .eq('status','ativo').eq('listar_publico', true).order('nome');
  if(error){ document.getElementById('lista').innerHTML = '<div class="empty">Não foi possível carregar agora.</div>'; return; }
  dados = data || [];
  render();
}

window.render = function(){
  const busca=(document.getElementById('fBusca').value||'').toLowerCase().trim();
  const mod=document.getElementById('fMod').value;
  const cid=(document.getElementById('fCidade').value||'').toLowerCase().trim();
  let lista = dados.filter(p=>{
    if(mod && p.modalidade!==mod && p.modalidade!=='ambos') return false;
    if(cid && !(p.cidade||'').toLowerCase().includes(cid)) return false;
    if(busca){ const b=`${p.nome} ${p.abordagem} ${p.observacoes}`.toLowerCase(); if(!b.includes(busca)) return false; }
    return true;
  });
  const cont = document.getElementById('lista');
  if(lista.length===0){ cont.innerHTML='<div class="empty">Nenhum psicólogo encontrado com esses filtros.</div>'; return; }
  cont.innerHTML = '<div class="grid">' + lista.map(p=>{
    const fone=(p.telefone||'').replace(/\D/g,'');
    // Valores NÃO são exibidos publicamente. Mostramos apenas se o profissional atende valor social.
    const fazSocial = (p.social_online && p.social_online!=='nao') || (p.social_presencial && p.social_presencial!=='nao') || (p.atende_social && p.atende_social!=='nao');
    const linhas=[];
    if(fazSocial){ linhas.push(`<div class="linha"><span class="badge">💚 Atende valor social</span></div>`); }
    return `<div class="card">
      <h3>${p.nome}</h3>
      <div class="crp">${p.crp||''} · ${modLabel[p.modalidade]||p.modalidade||''}${p.cidade?(' · '+p.cidade):''}</div>
      <div class="ab"><strong>${p.abordagem||''}</strong></div>
      ${linhas.join('')}
      ${p.observacoes?`<div class="obs">${p.observacoes}</div>`:''}
      <div class="contato">
        ${p.email?`<a href="mailto:${p.email}">✉ ${p.email}</a>`:''}
        ${fone?`<br><a href="https://wa.me/${fone}" target="_blank">WhatsApp ${p.telefone}</a>`:''}
      </div>
    </div>`;
  }).join('') + '</div>';
};

carregar();
</script>
